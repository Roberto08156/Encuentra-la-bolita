<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>¿Dónde está la bolita? - Rey de Diamantes Edition</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Outfit:wght@400;600;800&family=Righteous&display=swap" rel="stylesheet">

    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #022c22;
            color: #f8fafc;
            overflow: hidden;
        }

        .font-card {
            font-family: 'Cinzel', serif;
        }

        .font-title {
            font-family: 'Righteous', cursive;
        }

        /* Royal Emerald Casino Table Felt Background */
        .casino-table {
            background: 
                radial-gradient(circle at center, #065f46 0%, #044e3a 50%, #022c22 90%, #011711 100%),
                repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0, rgba(255,255,255,0.015) 12px, transparent 12px, transparent 24px);
        }

        /* Glass Panel Styling */
        .glass-panel {
            background: rgba(6, 44, 34, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(245, 158, 11, 0.25);
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.8);
        }

        /* Card Wrapper & Lifting Movement */
        .card-wrapper {
            position: absolute;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            will-change: transform;
        }

        .card-svg-container {
            transition: transform 0.38s cubic-bezier(0.34, 1.4, 0.64, 1);
            transform-origin: bottom center;
            filter: drop-shadow(0 14px 18px rgba(0,0,0,0.85));
        }

        /* Fully cover and hide ball when lowered, lift high to reveal */
        .card-wrapper.lifted .card-svg-container {
            transform: translateY(-110px) rotate(-6deg);
        }

        /* Ball Styling & Glow */
        .ball-element {
            box-shadow: 0 0 15px #fbbf24, 0 0 30px #f59e0b, inset -3px -3px 8px rgba(0,0,0,0.6);
            animation: ballGlow 1.2s infinite ease-in-out alternate;
        }

        @keyframes ballGlow {
            0% { transform: scale(1); filter: drop-shadow(0 0 8px #f59e0b); }
            100% { transform: scale(1.12); filter: drop-shadow(0 0 18px #fbbf24); }
        }

        /* Confetti particle animation */
        .confetti-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            pointer-events: none;
            border-radius: 2px;
            animation: confettiFall 1.2s ease-out forwards;
        }

        @keyframes confettiFall {
            0% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
            100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(360deg); }
        }
    </style>
</head>
<body class="casino-table w-screen h-screen flex flex-col justify-between items-center relative select-none">

    <!-- TOP HEADER / HUD -->
    <header class="w-full max-w-2xl px-4 pt-4 flex justify-between items-center z-20">
        <!-- Game Title -->
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-red-600 via-amber-500 to-yellow-300 flex items-center justify-center shadow-lg shadow-amber-500/20 border border-amber-300/40">
                <span class="text-amber-950 font-black text-xl leading-none">♦</span>
            </div>
            <div>
                <h1 class="font-title text-lg sm:text-2xl text-amber-300 tracking-wide uppercase leading-tight">Cartas del Rey</h1>
                <span id="diffLabel" class="text-[10px] text-emerald-200/70 tracking-widest uppercase block -mt-0.5">NIVEL: FÁCIL (3 CARTAS)</span>
            </div>
        </div>

        <!-- Mute & Settings Controls -->
        <div class="flex items-center space-x-2.5">
            <button id="btnMute" class="glass-panel p-2.5 rounded-xl text-amber-200 hover:text-white active:scale-95 transition">
                <i id="muteIcon" class="fa-solid fa-volume-high text-lg"></i>
            </button>
            <button id="btnSettings" class="glass-panel p-2.5 rounded-xl text-amber-200 hover:text-white active:scale-95 transition">
                <i class="fa-solid fa-gear text-lg"></i>
            </button>
        </div>
    </header>

    <!-- SCOREBOARD HUD -->
    <section class="w-full max-w-md px-4 mt-2 z-20">
        <div class="glass-panel rounded-2xl p-3 grid grid-cols-3 gap-2 text-center border-t border-amber-400/30">
            <div class="flex flex-col">
                <span class="text-[10px] text-emerald-200/70 tracking-wider uppercase font-semibold">PUNTOS</span>
                <span id="hudScore" class="font-title text-xl text-yellow-300">0</span>
            </div>
            <div class="flex flex-col border-x border-emerald-800/80">
                <span class="text-[10px] text-emerald-200/70 tracking-wider uppercase font-semibold">RACHA</span>
                <div class="flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-fire text-amber-400 text-xs"></i>
                    <span id="hudStreak" class="font-title text-xl text-amber-400">0</span>
                </div>
            </div>
            <div class="flex flex-col">
                <span class="text-[10px] text-emerald-200/70 tracking-wider uppercase font-semibold">RÉCORD</span>
                <span id="hudHighScore" class="font-title text-xl text-emerald-300">0</span>
            </div>
        </div>
    </section>

    <!-- MAIN GAME STAGE -->
    <main class="w-full max-w-2xl flex-1 flex flex-col justify-center items-center relative z-10 px-2">
        <!-- STATUS BANNER -->
        <div id="statusBanner" class="glass-panel px-6 py-2.5 rounded-full mb-6 text-center border border-amber-400/40 transition-all duration-300 shadow-xl">
            <span id="statusText" class="font-bold text-sm sm:text-base text-amber-200 tracking-wide">
                ¡Presiona INICIAR para ver la bolita!
            </span>
        </div>

        <!-- TABLE STAGE FOR KING OF DIAMONDS CARDS -->
        <div id="stage" class="w-full h-72 sm:h-80 relative flex items-center justify-center overflow-visible">
            <!-- Casino Felt Table Shadow -->
            <div class="absolute bottom-2 w-11/12 h-14 bg-gradient-to-r from-emerald-950/60 via-amber-900/20 to-emerald-950/60 rounded-full border border-amber-500/20 blur-xs shadow-[0_15px_30px_rgba(0,0,0,0.8)]"></div>

            <!-- Dynamic King Cards container -->
            <div id="cardsContainer" class="w-full h-full relative"></div>
            
            <!-- Confetti Layer -->
            <div id="confettiLayer" class="absolute inset-0 pointer-events-none z-30"></div>
        </div>
    </main>

    <!-- ACTION CONTROLS / RESTART FOOTER -->
    <footer class="w-full max-w-md px-4 pb-6 z-20 flex flex-col items-center space-y-3">
        <!-- Main Play / Action Button -->
        <button id="btnAction" class="w-full py-4 bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-600 hover:from-amber-400 hover:to-yellow-300 active:scale-95 rounded-2xl font-black text-amber-950 tracking-wider text-base sm:text-lg shadow-xl shadow-amber-500/20 transition flex items-center justify-center space-x-2 border border-yellow-200/50">
            <i id="btnActionIcon" class="fa-solid fa-play"></i>
            <span id="btnActionText">INICIAR JUEGO</span>
        </button>

        <!-- Reset Game Session Button -->
        <button id="btnReset" class="text-xs text-emerald-200/70 hover:text-white transition flex items-center space-x-1.5 py-1">
            <i class="fa-solid fa-rotate-right"></i>
            <span>Reiniciar Partida</span>
        </button>
    </footer>

    <!-- GAME OVER MODAL -->
    <div id="gameOverModal" class="absolute inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md hidden">
        <div class="glass-panel max-w-sm w-full rounded-3xl p-6 text-center border border-red-500/50 shadow-2xl relative">
            <div class="w-16 h-16 bg-red-600/20 rounded-full flex items-center justify-center mx-auto mb-3 border border-red-500/60 text-red-400">
                <i class="fa-solid fa-xmark text-3xl"></i>
            </div>

            <h2 class="font-title text-2xl text-red-400 uppercase tracking-wider mb-1">¡PERDISTE!</h2>
            <p class="text-xs text-emerald-100/70 mb-4">Esa carta no tenía la bolita</p>

            <div class="glass-panel rounded-2xl p-4 my-4 space-y-2 border border-white/10">
                <div class="flex justify-between items-center text-sm">
                    <span class="text-emerald-100/70">Puntuación Final:</span>
                    <span id="goFinalScore" class="font-title text-yellow-300 text-lg">0</span>
                </div>
                <div class="flex justify-between items-center text-sm">
                    <span class="text-emerald-100/70">Racha lograda:</span>
                    <span id="goFinalStreak" class="font-title text-amber-400 text-lg">0</span>
                </div>
                <div class="flex justify-between items-center text-sm pt-2 border-t border-emerald-800">
                    <span class="text-emerald-100/70">Mejor Récord:</span>
                    <span id="goHighScore" class="font-title text-emerald-300 text-lg">0</span>
                </div>
            </div>

            <button id="btnRestartGame" class="w-full py-4 bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-600 hover:from-amber-400 hover:to-yellow-300 active:scale-95 text-amber-950 font-black rounded-2xl text-base tracking-wider shadow-lg shadow-amber-500/30 transition flex items-center justify-center space-x-2 border border-yellow-200/50">
                <i class="fa-solid fa-rotate-right"></i>
                <span>VOLVER A JUGAR</span>
            </button>
        </div>
    </div>

    <!-- SETTINGS & DIFFICULTY MODAL -->
    <div id="settingsModal" class="absolute inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md hidden">
        <div class="glass-panel max-w-sm w-full rounded-3xl p-6 text-center border border-amber-500/40 shadow-2xl relative">
            <button id="btnCloseSettings" class="absolute top-4 right-4 text-emerald-200 hover:text-white p-2">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <div class="w-12 h-12 bg-amber-500/20 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-amber-500/40 text-amber-300">
                <i class="fa-solid fa-sliders text-xl"></i>
            </div>

            <h2 class="font-title text-xl text-white uppercase tracking-wider mb-1">Dificultad</h2>
            <p class="text-xs text-emerald-100/70 mb-5">Elige la cantidad de cartas y la velocidad</p>

            <div class="space-y-3 mb-6">
                <!-- Easy (3 Cards) -->
                <button data-diff="easy" class="btn-diff w-full p-3 rounded-2xl border border-amber-500/50 bg-amber-500/20 text-amber-300 flex items-center justify-between font-bold text-sm transition">
                    <div class="flex items-center space-x-3">
                        <span class="text-xl font-black">3♦</span>
                        <div class="text-left">
                            <span class="block">FÁCIL</span>
                            <span class="text-[10px] text-emerald-200/60 font-normal">3 Cartas • Velocidad Normal</span>
                        </div>
                    </div>
                    <i class="fa-solid fa-check text-amber-400 check-icon"></i>
                </button>

                <!-- Medium (4 Cards) -->
                <button data-diff="medium" class="btn-diff w-full p-3 rounded-2xl border border-emerald-800 bg-emerald-950/50 text-emerald-200 flex items-center justify-between font-bold text-sm transition">
                    <div class="flex items-center space-x-3">
                        <span class="text-xl font-black">4♦</span>
                        <div class="text-left">
                            <span class="block">MEDIO</span>
                            <span class="text-[10px] text-emerald-200/60 font-normal">4 Cartas • Velocidad Rápida</span>
                        </div>
                    </div>
                    <i class="fa-solid fa-check text-amber-400 check-icon hidden"></i>
                </button>

                <!-- Hard (5 Cards) -->
                <button data-diff="hard" class="btn-diff w-full p-3 rounded-2xl border border-emerald-800 bg-emerald-950/50 text-emerald-200 flex items-center justify-between font-bold text-sm transition">
                    <div class="flex items-center space-x-3">
                        <span class="text-xl font-black">5♦</span>
                        <div class="text-left">
                            <span class="block">DIFÍCIL</span>
                            <span class="text-[10px] text-emerald-200/60 font-normal">5 Cartas • Velocidad Extrema</span>
                        </div>
                    </div>
                    <i class="fa-solid fa-check text-amber-400 check-icon hidden"></i>
                </button>
            </div>

            <button id="btnSaveSettings" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-amber-950 font-black rounded-xl text-sm transition">
                GUARDAR Y REINICIAR
            </button>
        </div>
    </div>

    <!-- JAVASCRIPT GAME ENGINE -->
    <script>
        /**
         * ¿DÓNDE ESTÁ LA BOLITA? - REY DE DIAMANTES EDITION
         */

        // --- SYNTHESIZED SOUND ENGINE ---
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.isMuted = false;
                this.initialized = false;
            }

            init() {
                if (this.initialized) return;
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                    this.initialized = true;
                } catch (e) {
                    console.warn("Web Audio API not supported", e);
                }
            }

            resume() {
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playSlide() {
                if (this.isMuted || !this.ctx) return;
                this.resume();

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180 + Math.random() * 60, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(90, this.ctx.currentTime + 0.1);

                gain.gain.setValueAtTime(0.14, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.11);
            }

            playLift() {
                if (this.isMuted || !this.ctx) return;
                this.resume();

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(420, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(850, this.ctx.currentTime + 0.09);

                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.11);
            }

            playWin() {
                if (this.isMuted || !this.ctx) return;
                this.resume();

                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];

                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);

                    gain.gain.setValueAtTime(0.25, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.22);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.24);
                });
            }

            playLose() {
                if (this.isMuted || !this.ctx) return;
                this.resume();

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.45);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.46);
            }
        }

        // --- MAIN GAME ENGINE ---
        class ShellGame {
            constructor() {
                this.sound = new SoundEngine();

                // Difficulty Configs
                this.difficulties = {
                    easy: { cards: 3, shuffles: 8, speed: 280, name: 'FÁCIL (3 CARTAS)' },
                    medium: { cards: 4, shuffles: 13, speed: 200, name: 'MEDIO (4 CARTAS)' },
                    hard: { cards: 5, shuffles: 18, speed: 140, name: 'DIFÍCIL (5 CARTAS)' }
                };
                this.currentDiffKey = 'easy';

                // Game States
                this.score = 0;
                this.streak = 0;
                this.highScore = parseInt(localStorage.getItem('shell_game_highscore_king') || '0', 10);
                this.winningCardIndex = 0;
                this.positions = [];
                this.isShuffling = false;
                this.canPick = false;

                // DOM Bindings
                this.dom = {
                    hudScore: document.getElementById('hudScore'),
                    hudStreak: document.getElementById('hudStreak'),
                    hudHighScore: document.getElementById('hudHighScore'),
                    diffLabel: document.getElementById('diffLabel'),
                    statusText: document.getElementById('statusText'),
                    statusBanner: document.getElementById('statusBanner'),
                    stage: document.getElementById('stage'),
                    cardsContainer: document.getElementById('cardsContainer'),
                    confettiLayer: document.getElementById('confettiLayer'),
                    btnAction: document.getElementById('btnAction'),
                    btnActionText: document.getElementById('btnActionText'),
                    btnActionIcon: document.getElementById('btnActionIcon'),
                    btnReset: document.getElementById('btnReset'),
                    btnMute: document.getElementById('btnMute'),
                    muteIcon: document.getElementById('muteIcon'),
                    btnSettings: document.getElementById('btnSettings'),
                    settingsModal: document.getElementById('settingsModal'),
                    btnCloseSettings: document.getElementById('btnCloseSettings'),
                    btnSaveSettings: document.getElementById('btnSaveSettings'),
                    gameOverModal: document.getElementById('gameOverModal'),
                    goFinalScore: document.getElementById('goFinalScore'),
                    goFinalStreak: document.getElementById('goFinalStreak'),
                    goHighScore: document.getElementById('goHighScore'),
                    btnRestartGame: document.getElementById('btnRestartGame')
                };

                this.bindEvents();
                this.updateHud();
                this.initStage();
            }

            bindEvents() {
                this.dom.btnAction.addEventListener('click', () => {
                    this.sound.init();
                    if (!this.isShuffling && !this.canPick) {
                        this.startRoundFlow();
                    }
                });

                this.dom.btnReset.addEventListener('click', () => {
                    this.restartFullGame();
                });

                this.dom.btnRestartGame.addEventListener('click', () => {
                    this.dom.gameOverModal.classList.add('hidden');
                    this.restartFullGame();
                    this.startRoundFlow();
                });

                this.dom.btnMute.addEventListener('click', () => {
                    this.sound.isMuted = !this.sound.isMuted;
                    this.dom.muteIcon.className = this.sound.isMuted ? 
                        "fa-solid fa-volume-xmark text-lg text-red-400" : 
                        "fa-solid fa-volume-high text-lg text-amber-200";
                });

                this.dom.btnSettings.addEventListener('click', () => {
                    this.dom.settingsModal.classList.remove('hidden');
                });

                this.dom.btnCloseSettings.addEventListener('click', () => {
                    this.dom.settingsModal.classList.add('hidden');
                });

                document.querySelectorAll('.btn-diff').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const target = e.currentTarget;
                        const diffKey = target.getAttribute('data-diff');
                        
                        document.querySelectorAll('.btn-diff').forEach(b => {
                            b.classList.remove('border-amber-500/50', 'bg-amber-500/20', 'text-amber-300');
                            b.classList.add('border-emerald-800', 'bg-emerald-950/50', 'text-emerald-200');
                            b.querySelector('.check-icon').classList.add('hidden');
                        });

                        target.classList.remove('border-emerald-800', 'bg-emerald-950/50', 'text-emerald-200');
                        target.classList.add('border-amber-500/50', 'bg-amber-500/20', 'text-amber-300');
                        target.querySelector('.check-icon').classList.remove('hidden');

                        this.pendingDiffKey = diffKey;
                    });
                });

                this.dom.btnSaveSettings.addEventListener('click', () => {
                    if (this.pendingDiffKey) {
                        this.currentDiffKey = this.pendingDiffKey;
                    }
                    this.dom.settingsModal.classList.add('hidden');
                    this.restartFullGame();
                });

                window.addEventListener('resize', () => {
                    this.updateCardPositions(false);
                });
            }

            updateHud() {
                this.dom.hudScore.textContent = this.score;
                this.dom.hudStreak.textContent = this.streak;
                this.dom.hudHighScore.textContent = this.highScore;
                this.dom.diffLabel.textContent = `NIVEL: ${this.difficulties[this.currentDiffKey].name}`;
            }

            restartFullGame() {
                this.score = 0;
                this.streak = 0;
                this.updateHud();
                this.initStage();
                this.setStatus("Juego reiniciado. Presiona INICIAR.", "amber");
            }

            setStatus(text, color = "amber") {
                this.dom.statusText.textContent = text;
                if (color === "green") {
                    this.dom.statusBanner.className = "glass-panel px-6 py-2.5 rounded-full mb-6 text-center border border-emerald-400/60 text-emerald-300 shadow-xl shadow-emerald-950/40";
                } else if (color === "red") {
                    this.dom.statusBanner.className = "glass-panel px-6 py-2.5 rounded-full mb-6 text-center border border-red-500/60 text-red-300 shadow-xl shadow-red-950/40";
                } else {
                    this.dom.statusBanner.className = "glass-panel px-6 py-2.5 rounded-full mb-6 text-center border border-amber-400/40 text-amber-200 shadow-xl";
                }
            }

            // SETUP KING OF DIAMONDS CARDS STAGE
            initStage() {
                const config = this.difficulties[this.currentDiffKey];
                this.dom.cardsContainer.innerHTML = '';
                this.positions = [];
                this.isShuffling = false;
                this.canPick = false;

                this.updateActionButton(true, this.score > 0 ? "SIGUIENTE RONDA" : "INICIAR JUEGO", "fa-play");

                // Select winning card
                this.winningCardIndex = Math.floor(Math.random() * config.cards);

                for (let i = 0; i < config.cards; i++) {
                    this.positions.push(i);

                    const cardWrapper = document.createElement('div');
                    cardWrapper.className = 'card-wrapper flex flex-col items-center justify-end';
                    cardWrapper.dataset.index = i;

                    // FLAT RECTANGULAR CARD FEATURING EXACT KING OF DIAMONDS DESIGN
                    cardWrapper.innerHTML = `
                        <!-- GOLDEN BALL (POSITIONED LOW INSIDE CENTER OF CARD AREA) -->
                        <div class="ball-container absolute bottom-6 z-0 flex items-center justify-center ${i === this.winningCardIndex ? '' : 'hidden'}">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-600 via-yellow-400 to-amber-200 ball-element flex items-center justify-center shadow-lg">
                                <div class="w-2.5 h-2.5 rounded-full bg-white/90 -mt-1 -ml-1"></div>
                            </div>
                        </div>

                        <!-- RECTANGULAR PLAYING CARD SVG CONTAINER -->
                        <div class="card-svg-container relative z-10">
                            <svg class="w-24 h-36 sm:w-28 sm:h-44" viewBox="0 0 140 210">
                                <defs>
                                    <!-- Metallic Silver Textured Background Gradient -->
                                    <linearGradient id="silverCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" stop-color="#f8fafc"/>
                                        <stop offset="25%" stop-color="#cbd5e1"/>
                                        <stop offset="50%" stop-color="#94a3b8"/>
                                        <stop offset="75%" stop-color="#e2e8f0"/>
                                        <stop offset="100%" stop-color="#64748b"/>
                                    </linearGradient>

                                    <!-- Royal Red Coat Gradient -->
                                    <linearGradient id="royalRedCoat" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" stop-color="#dc2626"/>
                                        <stop offset="50%" stop-color="#b91c1c"/>
                                        <stop offset="100%" stop-color="#7f1d1d"/>
                                    </linearGradient>

                                    <!-- Gold Trim & Ornate Details -->
                                    <linearGradient id="goldOrnate" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" stop-color="#fef08a"/>
                                        <stop offset="50%" stop-color="#eab308"/>
                                        <stop offset="100%" stop-color="#a16207"/>
                                    </linearGradient>

                                    <pattern id="brushedMetal" width="10" height="10" patternUnits="userSpaceOnUse">
                                        <line x1="0" y1="0" x2="10" y2="10" stroke="#000" stroke-opacity="0.03" stroke-width="1"/>
                                    </pattern>
                                </defs>

                                <!-- FLAT CARD BASE (Rounded Corners Rectangular Playing Card) -->
                                <rect x="2" y="2" width="136" height="206" rx="14" ry="14" fill="url(#silverCardBg)" stroke="url(#goldOrnate)" stroke-width="2.5"/>
                                <rect x="2" y="2" width="136" height="206" rx="14" ry="14" fill="url(#brushedMetal)"/>
                                <rect x="7" y="7" width="126" height="196" rx="10" ry="10" fill="none" stroke="#475569" stroke-width="0.8" stroke-dasharray="3,2"/>

                                <!-- REVERSIBLE TWO-HEADED KING DESIGN (TOP & BOTTOM MIRRORED) -->
                                <g id="topKing">
                                    <!-- High Spiked Collar -->
                                    <path d="M 44 68 L 28 35 Q 70 42 112 35 L 96 68 Z" fill="#b91c1c" stroke="url(#goldOrnate)" stroke-width="1.5"/>
                                    <path d="M 48 68 L 38 42 Q 70 48 102 42 L 92 68 Z" fill="#7f1d1d"/>

                                    <!-- Royal Red Coat & Embroidery -->
                                    <path d="M 42 68 Q 70 58 98 68 L 94 105 L 46 105 Z" fill="url(#royalRedCoat)"/>
                                    <line x1="70" y1="65" x2="70" y2="105" stroke="url(#goldOrnate)" stroke-width="2.5"/>
                                    
                                    <!-- Heart/Diamond Vest Detailing -->
                                    <g fill="url(#goldOrnate)">
                                        <path d="M 70 72 L 73 77 L 70 82 L 67 77 Z"/>
                                        <path d="M 70 88 L 74 94 L 70 100 L 66 94 Z"/>
                                    </g>

                                    <!-- King's Crown with Heart Motif -->
                                    <path d="M 46 36 L 54 20 L 70 30 L 86 20 L 94 36 Z" fill="url(#goldOrnate)" stroke="#78350f" stroke-width="0.8"/>
                                    <path d="M 70 22 C 65 14, 60 22, 70 28 C 80 22, 75 14, 70 22 Z" fill="#dc2626"/>

                                    <!-- King's Face & Skin -->
                                    <ellipse cx="70" cy="48" rx="13" ry="12" fill="#fef08a"/>
                                    <!-- Red Eye Makeup / Heart Mask Details -->
                                    <path d="M 64 45 C 62 42, 60 45, 64 48 C 68 45, 66 42, 64 45 Z" fill="#b91c1c"/>
                                    <path d="M 76 45 C 74 42, 72 45, 76 48 C 80 45, 78 42, 76 45 Z" fill="#b91c1c"/>
                                    <path d="M 66 53 Q 70 56 74 53" stroke="#b91c1c" stroke-width="1.2" fill="none"/>

                                    <!-- Golden Scepter with Heart Orb -->
                                    <line x1="104" y1="42" x2="98" y2="105" stroke="url(#goldOrnate)" stroke-width="3"/>
                                    <path d="M 104 36 C 96 26, 88 39, 104 49 C 120 39, 112 26, 104 36 Z" fill="url(#goldOrnate)" stroke="#78350f" stroke-width="0.8"/>
                                </g>

                                <!-- MIRRORED BOTTOM KING -->
                                <g id="bottomKing" transform="rotate(180 70 105)">
                                    <path d="M 44 68 L 28 35 Q 70 42 112 35 L 96 68 Z" fill="#b91c1c" stroke="url(#goldOrnate)" stroke-width="1.5"/>
                                    <path d="M 48 68 L 38 42 Q 70 48 102 42 L 92 68 Z" fill="#7f1d1d"/>
                                    <path d="M 42 68 Q 70 58 98 68 L 94 105 L 46 105 Z" fill="url(#royalRedCoat)"/>
                                    <line x1="70" y1="65" x2="70" y2="105" stroke="url(#goldOrnate)" stroke-width="2.5"/>
                                    <g fill="url(#goldOrnate)">
                                        <path d="M 70 72 L 73 77 L 70 82 L 67 77 Z"/>
                                        <path d="M 70 88 L 74 94 L 70 100 L 66 94 Z"/>
                                    </g>
                                    <path d="M 46 36 L 54 20 L 70 30 L 86 20 L 94 36 Z" fill="url(#goldOrnate)" stroke="#78350f" stroke-width="0.8"/>
                                    <path d="M 70 22 C 65 14, 60 22, 70 28 C 80 22, 75 14, 70 22 Z" fill="#dc2626"/>
                                    <ellipse cx="70" cy="48" rx="13" ry="12" fill="#fef08a"/>
                                    <path d="M 64 45 C 62 42, 60 45, 64 48 C 68 45, 66 42, 64 45 Z" fill="#b91c1c"/>
                                    <path d="M 76 45 C 74 42, 72 45, 76 48 C 80 45, 78 42, 76 45 Z" fill="#b91c1c"/>
                                    <path d="M 66 53 Q 70 56 74 53" stroke="#b91c1c" stroke-width="1.2" fill="none"/>
                                    <line x1="104" y1="42" x2="98" y2="105" stroke="url(#goldOrnate)" stroke-width="3"/>
                                    <path d="M 104 36 C 96 26, 88 39, 104 49 C 120 39, 112 26, 104 36 Z" fill="url(#goldOrnate)" stroke="#78350f" stroke-width="0.8"/>
                                </g>

                                <!-- TOP LEFT CORNER INDEX (K & DIAMOND) -->
                                <text x="12" y="26" font-family="'Cinzel', serif" font-weight="900" font-size="18" fill="#0f172a">K</text>
                                <path d="M 16 30 L 21 37 L 16 44 L 11 37 Z" fill="url(#goldOrnate)" stroke="#b45309" stroke-width="0.5"/>

                                <!-- BOTTOM RIGHT CORNER INDEX (K & DIAMOND - ROTATED) -->
                                <g transform="rotate(180 128 184)">
                                    <text x="124" y="180" font-family="'Cinzel', serif" font-weight="900" font-size="18" fill="#0f172a">K</text>
                                    <path d="M 128 184 L 133 191 L 128 198 L 123 191 Z" fill="url(#goldOrnate)" stroke="#b45309" stroke-width="0.5"/>
                                </g>
                            </svg>
                        </div>
                    `;

                    cardWrapper.addEventListener('click', () => this.handleCardPick(i));
                    this.dom.cardsContainer.appendChild(cardWrapper);
                }

                this.updateCardPositions(false);
            }

            updateCardPositions(animated = true) {
                const config = this.difficulties[this.currentDiffKey];
                const stageWidth = this.dom.cardsContainer.clientWidth;
                const cardWidth = 96;
                
                const spacing = (stageWidth - (config.cards * cardWidth)) / (config.cards + 1);

                const wrappers = this.dom.cardsContainer.querySelectorAll('.card-wrapper');
                wrappers.forEach(wrapper => {
                    const cardIndex = parseInt(wrapper.dataset.index, 10);
                    const logicalPos = this.positions[cardIndex];
                    
                    const posX = spacing + logicalPos * (cardWidth + spacing);
                    const posY = 15;

                    if (!animated) {
                        wrapper.style.transition = 'none';
                    } else {
                        wrapper.style.transition = `transform ${config.speed}ms cubic-bezier(0.4, 0, 0.2, 1)`;
                    }

                    wrapper.style.transform = `translate3d(${posX}px, ${posY}px, 0)`;
                });
            }

            // SEQUENCE: 1. REVEAL BALL -> 2. LOWER CARD (HIDES BALL FULLY) -> 3. SHUFFLE
            startRoundFlow() {
                if (this.isShuffling) return;

                this.updateActionButton(false, "PREPARANDO...", "fa-eye");
                this.setStatus("👀 ¡Observa debajo de qué carta está la bolita!", "amber");

                const wrappers = this.dom.cardsContainer.querySelectorAll('.card-wrapper');
                const winningWrapper = wrappers[this.winningCardIndex];

                // 1. REVEAL BALL (Lift card high)
                winningWrapper.classList.add('lifted');
                this.sound.playLift();

                // 2. Pause to observe, then LOWER card back down
                setTimeout(() => {
                    winningWrapper.classList.remove('lifted');

                    // Small delay after lowering before moving cards
                    setTimeout(() => {
                        this.startShuffle();
                    }, 400);

                }, 1300);
            }

            startShuffle() {
                const config = this.difficulties[this.currentDiffKey];
                this.isShuffling = true;
                this.canPick = false;

                this.updateActionButton(false, "MEZCLANDO...", "fa-spinner animate-spin");
                this.setStatus("🔄 ¡Mezclando cartas del Rey! Presta atención...", "amber");

                let shuffleCount = 0;

                const doShuffleStep = () => {
                    if (shuffleCount >= config.shuffles) {
                        this.isShuffling = false;
                        this.canPick = true;
                        this.setStatus("❓ ¿Debajo de qué carta quedó la bolita? ¡Toca una!", "amber");
                        this.updateActionButton(false, "ELIGE UNA CARTA", "fa-hand-pointer");
                        return;
                    }

                    let slotA = Math.floor(Math.random() * config.cards);
                    let slotB = Math.floor(Math.random() * config.cards);
                    while (slotA === slotB) {
                        slotB = Math.floor(Math.random() * config.cards);
                    }

                    const cardA = this.positions.indexOf(slotA);
                    const cardB = this.positions.indexOf(slotB);

                    this.positions[cardA] = slotB;
                    this.positions[cardB] = slotA;

                    this.updateCardPositions(true);
                    this.sound.playSlide();

                    shuffleCount++;
                    setTimeout(doShuffleStep, config.speed + 35);
                };

                doShuffleStep();
            }

            // PLAYER PICK
            handleCardPick(cardIndex) {
                if (!this.canPick || this.isShuffling) return;

                this.canPick = false;

                const wrappers = this.dom.cardsContainer.querySelectorAll('.card-wrapper');
                const pickedWrapper = wrappers[cardIndex];

                pickedWrapper.classList.add('lifted');
                this.sound.playLift();

                const isCorrect = (cardIndex === this.winningCardIndex);

                if (isCorrect) {
                    // --- SUCCESS ---
                    this.sound.playWin();
                    this.streak++;
                    this.score += (100 * this.streak);

                    if (this.score > this.highScore) {
                        this.highScore = this.score;
                        localStorage.setItem('shell_game_highscore_king', String(this.highScore));
                    }

                    this.updateHud();
                    this.setStatus(`¡ACERTASTE! 🎉 +${100 * this.streak} Pts (Racha x${this.streak})`, "green");
                    this.triggerConfetti();

                    if (navigator.vibrate) navigator.vibrate([80, 50, 80]);

                    // Next round
                    setTimeout(() => {
                        this.initStage();
                        this.startRoundFlow();
                    }, 1800);

                } else {
                    // --- GAME OVER ---
                    this.sound.playLose();
                    this.setStatus("¡INCORRECTO! ❌ La bolita no estaba ahí.", "red");

                    if (navigator.vibrate) navigator.vibrate(250);

                    // Reveal correct card
                    setTimeout(() => {
                        const correctWrapper = wrappers[this.winningCardIndex];
                        correctWrapper.classList.add('lifted');
                    }, 400);

                    // Show Game Over Modal
                    setTimeout(() => {
                        this.showGameOverModal();
                    }, 1400);
                }
            }

            showGameOverModal() {
                this.dom.goFinalScore.textContent = this.score;
                this.dom.goFinalStreak.textContent = this.streak;
                this.dom.goHighScore.textContent = this.highScore;
                this.dom.gameOverModal.classList.remove('hidden');
            }

            updateActionButton(enabled, text, iconClass) {
                this.dom.btnActionText.textContent = text;
                this.dom.btnActionIcon.className = `fa-solid ${iconClass}`;
                if (enabled) {
                    this.dom.btnAction.classList.remove('opacity-60', 'pointer-events-none');
                } else {
                    this.dom.btnAction.classList.add('opacity-60', 'pointer-events-none');
                }
            }

            triggerConfetti() {
                const layer = this.dom.confettiLayer;
                layer.innerHTML = '';
                const colors = ['#f59e0b', '#ef4444', '#10b981', '#facc15', '#fbbf24'];

                for (let i = 0; i < 35; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'confetti-particle';
                    particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    particle.style.left = '50%';
                    particle.style.top = '50%';

                    const dx = (Math.random() - 0.5) * 280;
                    const dy = (Math.random() - 0.7) * 260;

                    particle.style.setProperty('--dx', `${dx}px`);
                    particle.style.setProperty('--dy', `${dy}px`);

                    layer.appendChild(particle);
                }

                setTimeout(() => {
                    layer.innerHTML = '';
                }, 1300);
            }
        }

        // Launch Game on Load
        window.addEventListener('DOMContentLoaded', () => {
            window.shellGameInstance = new ShellGame();
        });
    </script>
